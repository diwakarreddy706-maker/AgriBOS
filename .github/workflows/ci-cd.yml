name: AgriBOS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-test:
    name: Backend Build, Test & Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./agribos-backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./agribos-backend
        run: npm ci || npm install

      - name: Run Backend Hardening & Real Business E2E Test Suite
        working-directory: ./agribos-backend
        run: npm test

  frontend-build-test:
    name: Frontend Build, Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./agribos-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./agribos-frontend
        run: npm ci || npm install

      - name: Frontend TypeScript Type Check & Production Build
        working-directory: ./agribos-frontend
        run: npm run build

  docker-validation:
    name: Docker Containerization Build Verification
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t agribos-backend:latest ./agribos-backend
