services:
  # 1. AgriBOS Backend Web Service
  - type: web
    name: agribos-backend
    runtime: node
    plan: free
    rootDir: agribos-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agribos-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: agribos-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # 2. AgriBOS Frontend Static Site
  - type: web
    name: agribos-frontend
    runtime: static
    rootDir: agribos-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agribos-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Render Managed PostgreSQL Test Database (Free Tier)
  - name: agribos-postgres-db
    databaseName: agribos_db
    user: agribos_user
    plan: free
