services:
  # 1. AgriBOS Backend Web Service
  - type: web
    name: agribos-backend
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm rebuild sqlite3
    startCommand: node apps/backend/src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: agribos-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # 2. AgriBOS Frontend Static Site
  - type: web
    name: agribos-frontend
    runtime: static
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @agribos/frontend build
    staticPublishPath: apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agribos-backend
          envVarKey: RENDER_EXTERNAL_URL
